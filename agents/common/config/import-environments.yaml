# Repository-configured defaults used by dc-import-diagnostics. Explicit values
# in a request override the corresponding field for that request.

default_environment: prod

environments:
  prod:
    scheduler:
      project: datcom-import-automation-prod
      location: us-central1

    workflow:
      project: datcom-import-automation-prod
      location: us-central1
      import_workflow: import-automation-workflow

    batch:
      project: datcom-import-automation-prod
      location: us-central1

    gcs:
      client_project: datcom-204919
      output_bucket: datcom-prod-imports

    spanner:
      project: datcom-store
      instance: dc-graph-staging
      database: dc_graph_1

  staging:
    scheduler:
      project: datcom-ci
      location: us-central1

    workflow:
      project: datcom-ci
      location: us-central1
      import_workflow: import-automation-workflow

    batch:
      project: datcom-ci
      location: us-central1

    gcs:
      client_project: datcom-ci
      output_bucket: datcom-ci-test

    spanner:
      project: datcom-ci
      instance: datcom-spanner-test
      database: dc-test-db
