[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datacommons-import-helper"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Import helper for Data Commons Import Automation"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "google-cloud-spanner>=3.60.0",
    "google-api-python-client",
    "google-cloud-storage",
    "google-cloud-workflows",
    "google-auth",
    "croniter",
    "requests",
]

[tool.hatch.version]
path = "__init__.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
