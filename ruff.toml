# Ruff lint configuration.
#
# Lint rules are enabled incrementally. Only list explicit rule codes in
# `select` (never "ALL" or whole groups) so that new Ruff releases cannot
# silently enable new rules.
#
# Formatting is still handled by yapf (see run_tests.sh).

line-length = 80

# Minimum Python version the code must run on. Ruff uses it to decide which
# syntax is valid (e.g. 3.12-only syntax is flagged as an error on older
# targets) and which version-specific rules/fixes apply.
#
# Python 3.12 is what CI (cloudbuild.py.yaml) and the import-automation
# executor/helper/validator Docker images use.
target-version = "py312"

extend-exclude = [
    # Generated protobuf code.
    "*_pb2.py",
    # Local scratch outputs and virtual environments.
    "**/scratch/**",
    "**/.env/**",
    # Jupyter notebooks (exploration only; also not checked by yapf).
    "*.ipynb",
]

[per-file-target-version]
# import-automation/workflow/ is still built and tested on Python 3.11:
#   - import-automation/workflow/cloudbuild.yaml builds the manifest catalog
#     and py_compile's the workflow/DAG files on python:3.11-slim.
#   - import-automation/cloudbuild.yaml runs import_automation_e2e.py and the
#     DAG E2E test on Python 3.11 images.
# The Airflow DAGs here may also run on Cloud Composer, whose Python version
# is managed outside this repo.
# Keeping this at py311 makes Ruff flag 3.12-only syntax in these files.
# TODO: Remove this override once the builds above move to Python 3.12 and
# the Cloud Composer environment is confirmed to run Python 3.12+.
"import-automation/workflow/**" = "py311"

[lint]
select = [
    # Syntax errors and invalid statements.
    "E9",
    "F63",
    "F7",
    # Undefined names.
    "F821",
    "F822",
    "F823",
    # Repeated keys in dict literals.
    "F601",
    # Invalid escape sequences in strings.
    "W605",
    # Comparisons to None/True/False, `not in`/`is not`, type comparisons.
    "E711",
    "E712",
    "E713",
    "E714",
    "E721",
    # Redefined-but-unused names and unused local variables.
    "F811",
    "F841",
    # f-strings without placeholders.
    "F541",
]
